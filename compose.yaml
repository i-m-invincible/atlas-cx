name: atlas-cx

x-api-image: &api-image
  image: atlas-cx-api:local
  build:
    context: .
    dockerfile: infra/api.Dockerfile

services:
  db:
    image: pgvector/pgvector:0.8.2-pg17@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas_cx}
      POSTGRES_USER: ${POSTGRES_USER:-atlas_bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-bootstrap-only}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-local-app-only}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:-local-migration-only}
      QUEUE_DB_PASSWORD: ${QUEUE_DB_PASSWORD:-local-queue-only}
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/001_roles.sql:/docker-entrypoint-initdb.d/001_roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    cpus: 1

  migrate:
    <<: *api-image
    command: ['.venv/bin/alembic', 'upgrade', 'head']
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://atlas_migrator:${MIGRATION_DB_PASSWORD:-local-migration-only}@db:5432/${POSTGRES_DB:-atlas_cx}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: ['/tmp:size=32m']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    mem_limit: 256m
    cpus: 0.5

  api:
    <<: *api-image
    environment:
      APP_ENV: ${APP_ENV:-development}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      DATABASE_URL: postgresql+psycopg://atlas_app:${APP_DB_PASSWORD:-local-app-only}@db:5432/${POSTGRES_DB:-atlas_cx}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Kolkata}
      SESSION_SIGNING_KEY: ${SESSION_SIGNING_KEY:-local-development-session-key-change-before-hosting}
      CURSOR_SIGNING_KEY: ${CURSOR_SIGNING_KEY:-local-development-cursor-key-change-before-hosting}
    ports:
      - '127.0.0.1:${API_PORT:-8000}:8000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          '.venv/bin/python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=4)",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
    read_only: true
    tmpfs: ['/tmp:size=32m']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    mem_limit: 256m
    cpus: 0.5

  web:
    image: atlas-cx-web:local
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:8080/healthz',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs: ['/tmp:size=32m']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    mem_limit: 128m
    cpus: 0.5

volumes:
  postgres-data:
